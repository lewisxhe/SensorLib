name: Build with ESP-IDF

on:
  workflow_dispatch:
  pull_request:
  push:
    paths:
      - "src/**"
      - "examples/platform/**"
      - ".github/workflows/esp-idf.yml"

jobs:
  esp-idf-build:
    if: |
      !(
        (github.event_name == 'push' && contains(github.event.head_commit.message, '[skip-idf]')) ||
        (github.event_name == 'pull_request' && (
          contains(github.event.pull_request.title, '[skip-idf]') ||
          contains(github.event.pull_request.body, '[skip-idf]')
        ))
      )
    strategy:
      matrix:
        idf_ver: ["latest"]
    runs-on: ubuntu-latest

    container: espressif/idf:${{ matrix.idf_ver }}
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: "recursive"
      - name: Build esp_idf_touch
        shell: bash
        run: |
          pwd
          . ${IDF_PATH}/export.sh
          cd examples/platform/esp_idf_touch
          idf.py build
      - name: Build esp_idf_sensor_hub
        shell: bash
        run: |
          pwd
          . ${IDF_PATH}/export.sh
          cd examples/platform/esp_idf_sensor_hub
          idf.py build
